name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare web assets and Capacitor config
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/
          fi
          if [ ! -f "www/index.html" ]; then
            echo "<h1>Shaghaf Kids</h1>" > www/index.html
          fi
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.shaghaf.kids",
            "appName": "Shaghaf Kids App",
            "webDir": "www"
          }
          EOF

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor web assets
        run: npx cap sync android

      - name: Fix duplicate Kotlin stdlib classes
        run: |
          python3 -c '
          p = "android/app/build.gradle"
          with open(p, "r", encoding="utf-8") as f:
              content = f.read()
          block = """
          configurations.all {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
          }
          """
          if "kotlin-stdlib-jdk7" not in content:
              content = content + "\n" + block
              with open(p, "w", encoding="utf-8") as f:
                  f.write(content)
          '

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shaghaf-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
