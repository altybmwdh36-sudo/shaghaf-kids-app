name: Build Android APK

on:
  push:
    branches: [main, repair/flutter-app-structure]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name=shaghaf_kids_app .
      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          if not p.exists():
              p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          s = s.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
          p.write_text(s)

          # Apply the required compile SDK to Android library plugins too.
          root = Path("android/build.gradle")
          if root.exists():
              gradle = root.read_text()
              gradle += """

          subprojects {
              afterEvaluate { subproject ->
                  def androidExtension = subproject.extensions.findByName("android")
                  if (androidExtension != null) {
                      androidExtension.compileSdkVersion(36)
                  }
              }
          }
          """
              root.write_text(gradle)
          PY
      - name: Allow network media playback
        run: sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shaghaf-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
