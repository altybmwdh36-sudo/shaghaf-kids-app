name: Build Android APK

concurrency:
  group: shaghaf-android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

on:
  push:
    branches: [main, repair/flutter-app-structure, restore/main-compatible, repair/shaghaf-release-2026]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name=shaghaf_kids_app .
      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          if not p.exists():
              p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          s = s.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
          p.write_text(s)
          PY
      - name: Allow network media playback
        run: sed -i '/<application/i\\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
      - name: Get dependencies
        run: flutter pub get
      - name: Apply Android Gradle compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob

          # Patch the deprecated ProGuard file reference that currently stops
          # flutter_inappwebview_android from configuring under the current AGP.
          plugin_files = glob.glob(str(Path.home() / ".pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle"))
          if not plugin_files:
              raise SystemExit("flutter_inappwebview_android Gradle file was not found after flutter pub get.")
          for name in plugin_files:
              p = Path(name)
              source = p.read_text()
              updated = source.replace("proguard-android.txt", "proguard-android-optimize.txt")
              if updated != source:
                  p.write_text(updated)
                  print(f"Updated deprecated ProGuard reference in {p}")
              else:
                  print(f"No deprecated ProGuard reference found in {p}")

          # Keep the supplied root-project adjustment in the generated Android
          # Gradle file without replacing Flutter's generated configuration.
          root = Path("android/build.gradle")
          if not root.exists():
              raise SystemExit("Generated android/build.gradle was not found.")
          source = root.read_text()
          marker = "SHAGHAF_INAPPWEBVIEW_RELEASE_MINIFY_FIX"
          if marker not in source:
              block = '''
          // SHAGHAF_INAPPWEBVIEW_RELEASE_MINIFY_FIX
          subprojects {
              afterEvaluate { project ->
                  if (project.name == 'flutter_inappwebview_android') {
                      project.android {
                          buildTypes {
                              release {
                                  minifyEnabled false
                              }
                          }
                      }
                  }
              }
          }
          '''
              if "tasks.register(\"clean\"" in source:
                  source = source.replace('tasks.register("clean"', block + '\ntasks.register("clean"', 1)
              else:
                  source += "\n" + block
              root.write_text(source)
              print("Merged the release minification adjustment into android/build.gradle")
          else:
              print("The Shaghaf Gradle adjustment is already present.")
          PY
      - name: Normalize Android plugin compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path.home() / ".pub-cache" / "hosted" / "pub.dev",
              Path("android"),
          ]
          patterns = [
              (re.compile(r"(\bcompileSdkVersion\s*[= ]\s*)\d+"), r"\g<1>36"),
              (re.compile(r"(\bcompileSdk\s*=\s*)\d+"), r"\g<1>36"),
              (re.compile(r"(\bcompileSdkVersion\s+)(?:flutter\.compileSdkVersion|\d+)"), r"\g<1>36"),
              (re.compile(r"(\bcompileSdk\s*=\s*)(?:flutter\.compileSdkVersion|\d+)"), r"\g<1>36"),
          ]
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for gradle in root.rglob("*"):
                  if gradle.name not in ("build.gradle", "build.gradle.kts"):
                      continue
                  try:
                      source = gradle.read_text()
                  except (OSError, UnicodeDecodeError):
                      continue
                  updated = source
                  for pattern, replacement in patterns:
                      updated = pattern.sub(replacement, updated)
                  if updated != source:
                      gradle.write_text(updated)
                      changed.append(str(gradle))
          print("Updated Gradle compile SDK in:")
          print("\n".join(changed) if changed else "No plugin overrides were needed.")
          PY
      - name: Analyze
        run: flutter analyze --no-fatal-infos lib/main.dart lib/backend.dart lib/device_guard.dart lib/media_hub.dart lib/admin_console.dart
      - name: Run widget tests
        run: flutter test
      - name: Verify Supabase publishable key
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ANON_KEY. Add the Supabase publishable/anon key in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Build APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: flutter build apk --release --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shaghaf-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
